# Generate SBOMs in CI with three free tools and (a) attach them to the run, (b) feed GitHub's dependency graph.
name: sbom
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # dependency submission API
  id-token: write        # keyless signing with cosign (optional step)

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. Syft: whole repo, CycloneDX + SPDX, uploaded as artifacts ------------------------------
      - uses: anchore/sbom-action@v0
        with:
          path: ./sample-app
          format: cyclonedx-json
          artifact-name: sbom-syft.cdx.json
          upload-artifact: true
          dependency-snapshot: true   # also pushes to GitHub's dependency graph

      # --- 2. Trivy: filesystem -> SPDX, uploaded ----------------------------------------------------
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./sample-app
          format: spdx-json
          output: sbom-trivy.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom-trivy.spdx.json, path: sbom-trivy.spdx.json }

      # --- 3. Build-plugin SBOMs: Maven + Gradle (most accurate for Java) ----------------------------
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -q -B -f sample-app/java-maven/pom.xml cyclonedx:makeBom
      - run: cd sample-app/java-gradle && gradle --no-daemon cyclonedxBom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-java-plugins
          path: |
            sample-app/java-maven/target/bom.json
            sample-app/java-gradle/build/reports/bom.json

      # --- 4. Submit the *resolved* Maven graph to GitHub (transitives Dependabot can't infer from a pom) ---
      - uses: advanced-security/maven-dependency-submission-action@v4
        with:
          directory: sample-app/java-maven

      # --- 5. Quality gate: fail if the Maven SBOM is not NTIA-compliant -----------------------------
      - run: |
          curl -sSL https://github.com/interlynk-io/sbomqs/releases/latest/download/sbomqs-linux-amd64 -o sbomqs && chmod +x sbomqs
          ./sbomqs compliance --ntia --basic sample-app/java-maven/target/bom.json
