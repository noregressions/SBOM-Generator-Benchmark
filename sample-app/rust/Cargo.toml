[package]
name = "sbom-sample-rust"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Small Rust app used as a target for SBOM generation tools"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
